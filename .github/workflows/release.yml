name: Release

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read versions from gradle.properties
        id: versions
        run: |
          set -euo pipefail
          mod_version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          kff_version="$(grep -E '^kff_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          fabric_api_version="$(grep -E '^fabric_api_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          fabric_kotlin_version="$(grep -E '^fabric_kotlin_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          echo "mod_version=${mod_version}" >> "$GITHUB_OUTPUT"
          echo "kff_version=${kff_version}" >> "$GITHUB_OUTPUT"
          echo "fabric_api_version=${fabric_api_version}" >> "$GITHUB_OUTPUT"
          echo "fabric_kotlin_version=${fabric_kotlin_version}" >> "$GITHUB_OUTPUT"
          echo "mod_version=${mod_version}" >> "$GITHUB_ENV"

      - name: Check tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          expected="v${{ steps.versions.outputs.mod_version }}"
          actual="${GITHUB_REF_NAME}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Tag ${actual} must be ${expected} (mod_version in gradle.properties)."
            exit 1
          fi

      - name: Point version tag at this commit
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          tag="v${{ steps.versions.outputs.mod_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${tag}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${tag}"

      - name: Require Modrinth token
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.MODRINTH_TOKEN }}" ]]; then
            echo "MODRINTH_TOKEN is empty. mc-publish would skip Modrinth and still succeed."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build and test
        run: gradle build --stacktrace

      - name: Collect release jars
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          jars=(build/libs/placedsticks-*.jar)
          if [[ ${#jars[@]} -eq 0 ]]; then
            echo "No placedsticks jar in build/libs"
            exit 1
          fi
          for jar in "${jars[@]}"; do
            case "${jar}" in
              *-sources.jar|*-javadoc.jar) continue ;;
              *) cp -v "${jar}" release-assets/ ;;
            esac
          done
          test -f "release-assets/placedsticks-neoforge-1.21.1-${{ steps.versions.outputs.mod_version }}.jar"
          fabric_jars=(fabric/build/libs/placedsticks-fabric-*.jar)
          if [[ ${#fabric_jars[@]} -eq 0 ]]; then
            echo "No Fabric jar in fabric/build/libs"
            exit 1
          fi
          for jar in "${fabric_jars[@]}"; do
            case "${jar}" in
              *-sources.jar|*-dev.jar) continue ;;
              *) cp -v "${jar}" release-assets/ ;;
            esac
          done
          test -f "release-assets/placedsticks-fabric-1.21.1-${{ steps.versions.outputs.mod_version }}.jar"
          chmod +x .github/scripts/fetch-companion-jars.sh
          .github/scripts/fetch-companion-jars.sh \
            release-assets \
            "${{ steps.versions.outputs.kff_version }}" \
            "${{ steps.versions.outputs.fabric_api_version }}" \
            "${{ steps.versions.outputs.fabric_kotlin_version }}"
          ls -lh release-assets

      - name: Delete release files that are no longer shipped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ steps.versions.outputs.mod_version }}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            echo "No existing release ${tag}"
            exit 0
          fi
          while IFS= read -r name; do
            [[ -z "${name}" ]] && continue
            if [[ ! -f "release-assets/${name}" ]]; then
              echo "Removing ${name}"
              gh release delete-asset "${tag}" "${name}" --yes
            fi
          done < <(gh release view "${tag}" --json assets --jq '.assets[].name')

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versions.outputs.mod_version }}
          name: Placed Sticks ${{ steps.versions.outputs.mod_version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/placedsticks-*.jar
            release-assets/kotlinforforge-*.jar
            release-assets/fabric-api-*.jar
            release-assets/fabric-language-kotlin-*.jar
          body: |
            Minecraft **1.21.1**. Install either the NeoForge set or the Fabric set, not both.

            ### NeoForge

            | File | Required | Source |
            | --- | --- | --- |
            | `placedsticks-neoforge-1.21.1-${{ steps.versions.outputs.mod_version }}.jar` | Yes | this mod |
            | `kotlinforforge-${{ steps.versions.outputs.kff_version }}-all.jar` | Yes | [Kotlin for Forge](https://modrinth.com/mod/kotlin-for-forge) (LGPL-2.1) |

            ### Fabric

            | File | Required | Source |
            | --- | --- | --- |
            | `placedsticks-fabric-1.21.1-${{ steps.versions.outputs.mod_version }}.jar` | Yes | this mod |
            | `fabric-api-*.jar` | Yes | [Fabric API](https://modrinth.com/mod/fabric-api) (Apache-2.0) |
            | `fabric-language-kotlin-*.jar` | Yes | [Fabric Language Kotlin](https://modrinth.com/mod/fabric-language-kotlin) (Apache-2.0) |

            Do not install `*-sources.jar`. Companion jars are official Modrinth builds. The line "requires fabric 0.100.3" means the Fabric API jar, not Fabric Loader.

      - name: Replace Modrinth versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${MODRINTH_TOKEN}" ]]; then
            echo "MODRINTH_TOKEN is empty. Modrinth publish will not replace an existing version."
            exit 0
          fi
          python3 .github/scripts/replace-modrinth-versions.py \
            placed-sticks \
            "${mod_version}" \
            "${mod_version}-fabric"

      - name: Publish Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: placed-sticks
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          name: ${{ steps.versions.outputs.mod_version }}
          version: ${{ steps.versions.outputs.mod_version }}
          version-type: release
          changelog: |
            Minecraft 1.21.1 / NeoForge. Placed Sticks ${{ steps.versions.outputs.mod_version }}.
          loaders: |
            neoforge
          game-versions: |
            1.21.1
          java: |
            21
          files: release-assets/placedsticks-neoforge-1.21.1-${{ steps.versions.outputs.mod_version }}.jar
          dependencies: |
            kotlin-for-forge(required){modrinth:ordsPcFz}

      - name: Publish Modrinth Fabric
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: placed-sticks
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false
          name: ${{ steps.versions.outputs.mod_version }} Fabric
          version: ${{ steps.versions.outputs.mod_version }}-fabric
          version-type: release
          changelog: |
            Minecraft 1.21.1 / Fabric. Placed Sticks ${{ steps.versions.outputs.mod_version }}.
          loaders: |
            fabric
          game-versions: |
            1.21.1
          java: |
            21
          files: release-assets/placedsticks-fabric-1.21.1-${{ steps.versions.outputs.mod_version }}.jar
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
            fabric-language-kotlin(required){modrinth:Ha28R6CL}

      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish jars to McnCDN
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          MCNS_WORKER_ID: ${{ secrets.MCNS_WORKER_ID }}
          MCNS_WORKER_KEY: ${{ secrets.MCNS_WORKER_KEY }}
          MCNS_MOD_VERSION: ${{ steps.versions.outputs.mod_version }}
          MCNS_COMMIT: ${{ github.sha }}
          MCNS_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          one() {
            local pattern="$1"
            shopt -s nullglob
            local matches=( $pattern )
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "Expected exactly one file for ${pattern}, found ${#matches[@]}: ${matches[*]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }
          mod_jar="release-assets/placedsticks-neoforge-1.21.1-${{ steps.versions.outputs.mod_version }}.jar"
          kff_jar="$(one 'release-assets/kotlinforforge-*.jar')"
          node scripts/mcns-release.mjs placed-sticks-mod auto \
            "mod=${mod_jar}" \
            "kotlinforforge=${kff_jar}"
